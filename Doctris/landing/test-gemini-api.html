<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- favicon -->
    <link rel="shortcut icon" href="../assets/images/LookAILogo.png">
    <meta charset="utf-8">
    <title>Test Gemini API</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto;
        }
        .container { margin: 20px 0; }
        .result { 
            margin: 20px 0; 
            padding: 15px; 
            border-radius: 8px; 
            border-left: 4px solid;
        }
        .success { 
            background: #d4edda; 
            border-left-color: #28a745; 
            color: #155724; 
        }
        .error { 
            background: #f8d7da; 
            border-left-color: #dc3545; 
            color: #721c24; 
        }
        .info { 
            background: #d1ecf1; 
            border-left-color: #17a2b8; 
            color: #0c5460; 
        }
        .warning {
            background: #fff3cd;
            border-left-color: #ffc107;
            color: #856404;
        }
        button { 
            padding: 12px 24px; 
            margin: 8px; 
            cursor: pointer; 
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #212529; }
        button:hover { opacity: 0.9; }
        input[type="text"] { 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            width: 300px;
            margin: 5px;
        }
        pre { 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 6px; 
            overflow-x: auto;
            font-size: 12px;
            border: 1px solid #e9ecef;
        }
        .step {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 4px solid #6c757d;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>🤖 Test Google Gemini API</h1>
    
    <div class="warning result">
        <h3>⚠️ Hướng Dẫn Setup</h3>
        <ol>
            <li>Lấy API key từ <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></li>
            <li>Nhập API key vào ô bên dưới</li>
            <li>Click "Test API" để kiểm tra</li>
        </ol>
    </div>

    <div class="container">
        <h3>🔑 API Configuration</h3>
        <div>
            <label><strong>Gemini API Key:</strong></label><br>
            <input type="password" id="apiKeyInput" placeholder="AIzaSyC..." style="width: 400px;">
            <button class="btn-warning" onclick="toggleApiKeyVisibility()">👁️ Show/Hide</button>
        </div>
        <div style="margin-top: 10px;">
            <label><strong>Test Prompt:</strong></label><br>
            <input type="text" id="promptInput" value="Gợi ý outfit cho thời tiết 15°C, nhiều mây, đi làm" style="width: 500px;">
        </div>
    </div>

    <div class="container">
        <h3>🧪 Test Functions</h3>
        <button class="btn-primary" onclick="testGeminiAPI()">🚀 Test Gemini API</button>
        <button class="btn-success" onclick="testOutfitSuggestion()">👕 Test Outfit Suggestion</button>
        <button class="btn-warning" onclick="showApiInfo()">ℹ️ API Info</button>
    </div>

    <div id="results"></div>

    <div class="step">
        <h4>📋 Checklist Setup</h4>
        <div id="checklist">
            <div>❌ API Key chưa nhập</div>
            <div>❌ Chưa test API</div>
            <div>❌ Chưa test outfit suggestion</div>
        </div>
    </div>

    <script>
        let isApiKeyVisible = false;

        function toggleApiKeyVisibility() {
            const input = document.getElementById('apiKeyInput');
            isApiKeyVisible = !isApiKeyVisible;
            input.type = isApiKeyVisible ? 'text' : 'password';
        }

        function updateChecklist() {
            const apiKey = document.getElementById('apiKeyInput').value;
            const checklist = document.getElementById('checklist');
            
            let items = [];
            items.push(apiKey ? '✅ API Key đã nhập' : '❌ API Key chưa nhập');
            items.push('❌ Chưa test API');
            items.push('❌ Chưa test outfit suggestion');
            
            checklist.innerHTML = items.map(item => `<div>${item}</div>`).join('');
        }

        async function testGeminiAPI() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!apiKey) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Thiếu API Key</h3>
                        <p>Vui lòng nhập Gemini API Key trước khi test!</p>
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = `
                <div class="result info">
                    <h3><span class="loading"></span> Đang test Gemini API...</h3>
                    <p>Prompt: "${prompt}"</p>
                </div>
            `;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 500
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP ${response.status}: ${errorData.error?.message || response.statusText}`);
                }

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;

                resultsDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ Gemini API hoạt động tốt!</h3>
                        <p><strong>Prompt:</strong> ${prompt}</p>
                        <p><strong>AI Response:</strong></p>
                        <div style="background: white; padding: 15px; border-radius: 6px; margin: 10px 0; border: 1px solid #ddd;">
                            ${aiResponse.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                    <div class="result info">
                        <h4>📊 Raw API Response:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;

                // Update checklist
                const checklist = document.getElementById('checklist');
                checklist.innerHTML = `
                    <div>✅ API Key đã nhập</div>
                    <div>✅ Test API thành công</div>
                    <div>❌ Chưa test outfit suggestion</div>
                `;

            } catch (error) {
                console.error('Gemini API Error:', error);
                
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Lỗi Gemini API</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                        <p><strong>API Key:</strong> ${apiKey.substring(0, 10)}...</p>
                    </div>
                    <div class="result info">
                        <h4>🔧 Cách khắc phục:</h4>
                        <ul>
                            <li>Kiểm tra API key có đúng không (phải bắt đầu bằng "AIza")</li>
                            <li>Đảm bảo API key được enable tại Google AI Studio</li>
                            <li>Kiểm tra quota (15 requests/phút)</li>
                            <li>Thử lại sau 1 phút nếu bị rate limit</li>
                        </ul>
                    </div>
                `;
            }
        }

        async function testOutfitSuggestion() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!apiKey) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Thiếu API Key</h3>
                        <p>Vui lòng nhập Gemini API Key trước!</p>
                    </div>
                `;
                return;
            }

            const outfitPrompt = `
Bạn là chuyên gia thời trang AI. 

Thời tiết hiện tại:
- Nhiệt độ: 15°C (cảm giác như 13°C)
- Thời tiết: Nhiều mây
- Độ ẩm: 75%
- Gió: 10 km/h

Hoạt động: Đi làm

Tủ đồ có sẵn:
- Áo: Áo sơ mi trắng (Trắng, Cotton)
- Áo: Áo thun đen (Đen, Cotton)  
- Áo: Áo hoodie xám (Xám, Nỉ)
- Áo: Áo len cổ lọ (Beige, Len)
- Quần: Quần jeans xanh (Xanh denim, Denim)
- Quần: Quần âu đen (Đen, Polyester)
- Giày: Sneaker trắng (Trắng, Da tổng hợp)
- Giày: Giày da nâu (Nâu, Da thật)

Hãy gợi ý outfit cụ thể từ tủ đồ có sẵn, bao gồm:
1. Áo (loại, màu, chất liệu)
2. Quần (loại, màu)  
3. Giày dép
4. Phụ kiện (nếu cần)
5. Lý do tại sao phù hợp

Format: JSON với các trường: top, bottom, shoes, accessories, reason, comfort_score (1-10)
            `;

            resultsDiv.innerHTML = `
                <div class="result info">
                    <h3><span class="loading"></span> Đang test Outfit Suggestion...</h3>
                </div>
            `;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: outfitPrompt
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 500
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;

                resultsDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ Outfit Suggestion thành công!</h3>
                        <div style="background: white; padding: 15px; border-radius: 6px; margin: 10px 0; border: 1px solid #ddd;">
                            <h4>🤖 AI Gợi Ý:</h4>
                            ${aiResponse.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;

                // Update checklist
                const checklist = document.getElementById('checklist');
                checklist.innerHTML = `
                    <div>✅ API Key đã nhập</div>
                    <div>✅ Test API thành công</div>
                    <div>✅ Test outfit suggestion thành công</div>
                `;

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Lỗi Outfit Suggestion</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        function showApiInfo() {
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = `
                <div class="result info">
                    <h3>ℹ️ Thông Tin Gemini API</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 15px 0;">
                        <div>
                            <h4>📊 Giới Hạn Miễn Phí:</h4>
                            <ul>
                                <li><strong>15 requests/phút</strong></li>
                                <li><strong>1,500 requests/ngày</strong></li>
                                <li><strong>45,000 requests/tháng</strong></li>
                                <li><strong>30,000 tokens/request</strong></li>
                            </ul>
                        </div>
                        <div>
                            <h4>🔗 Links Hữu Ích:</h4>
                            <ul>
                                <li><a href="https://aistudio.google.com/app/apikey" target="_blank">Lấy API Key</a></li>
                                <li><a href="https://ai.google.dev/docs" target="_blank">Documentation</a></li>
                                <li><a href="https://aistudio.google.com/app/prompts/new_chat" target="_blank">Test Prompts</a></li>
                            </ul>
                        </div>
                    </div>
                    <div style="background: #fff3cd; padding: 10px; border-radius: 6px; margin: 10px 0;">
                        <strong>💡 Tip:</strong> Nếu bị rate limit (429), đợi 1 phút rồi thử lại!
                    </div>
                </div>
            `;
        }

        // Auto update checklist when API key changes
        document.getElementById('apiKeyInput').addEventListener('input', updateChecklist);
        
        // Initialize
        updateChecklist();
    </script>
</body>
</html>
