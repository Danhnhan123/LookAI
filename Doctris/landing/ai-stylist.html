<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <title>AI Phối Đồ - LookAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trợ lý AI phối đồ thông minh - Nhận gợi ý trang phục cá nhân hóa" />
    <meta name="keywords" content="AI Stylist, Phối đồ, Gợi ý trang phục, Chatbot thời trang" />

    <link rel="shortcut icon" href="../assets/images/favicon.ico.png">
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="../assets/css/materialdesignicons.min.css" rel="stylesheet" type="text/css" />
    <link href="../assets/css/remixicon.css" rel="stylesheet" type="text/css" />

    <link href="../assets/css/style.min.css" rel="stylesheet" type="text/css" id="theme-opt" />
    <style>
        .chat-container {
            height: 600px;
            border: 1px solid #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            background: #fff;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-messages {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.bot {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }
        .message.user .message-content {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .message.user .message-avatar {
            background: #007bff;
            color: white;
        }
        .message.bot .message-avatar {
            background: #6c757d;
            color: white;
        }
        .chat-input {
            padding: 15px;
            border-top: 1px solid #e9ecef;
            background: white;
        }
        .outfit-suggestion {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            background: white;
        }
        .outfit-item {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #dee2e6;
        }
        .quick-actions {
            margin-bottom: 20px;
        }
        .quick-action-btn {
            margin: 5px;
            border-radius: 20px;
        }
        .typing-indicator {
            display: none;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            background: #6c757d;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

<body>

    <header id="topnav" class="navigation sticky">
        <div class="container">

                <a class="logo" href="index.html">
                    <span class="logo-light-mode">
                        <img src="../assets/images/LookAILogo.png" class="l-dark" height="80" alt="LookAI Logo">
                        <img src="../assets/images/LookAILogo.png" class="l-light" height="80" alt="LookAI Logo">
                    </span>

            <div id="navigation">
                <ul class="navigation-menu">
                    <li><a href="index.html" class="sub-menu-item">Trang chủ</a></li>

            <div class="menu-extras">

    <section class="bg-half-170 d-table w-100" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="bg-overlay bg-overlay-dark"></div>
        <div class="container">
            <div class="row mt-5 justify-content-center">
                <div class="col-12">
                    <div class="heading-title text-center">
                        <i class="ri-robot-fill text-white display-4 mb-3"></i>
                        <h2 class="text-white title-dark mb-3">AI Phối Đồ Thông Minh</h2>
                        <p class="text-white-50 para-desc mx-auto mb-0">Trò chuyện với AI để nhận gợi ý trang phục phù hợp với mọi hoàn cảnh</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="row">
                <div class="col-12 mb-4">
                    <div class="card border-0 shadow rounded">
                        <div class="card-body">
                            <h5 class="card-title mb-3">
                                <i class="ri-flashlight-line text-primary me-2"></i>
                                Gợi Ý Nhanh
                            </h5>
                            <div class="quick-actions text-center">
                                <button class="btn btn-outline-primary quick-action-btn" onclick="sendQuickMessage('Gợi ý trang phục đi làm hôm nay')">
                                    <i class="ri-briefcase-line me-1"></i>Đi làm
                                </button>
                                <button class="btn btn-outline-success quick-action-btn" onclick="sendQuickMessage('Trang phục dạo phố cuối tuần')">
                                    <i class="ri-walk-line me-1"></i>Dạo phố
                                </button>
                                <button class="btn btn-outline-warning quick-action-btn" onclick="sendQuickMessage('Phối đồ cho buổi hẹn hò')">
                                    <i class="ri-heart-line me-1"></i>Hẹn hò
                                </button>
                                <button class="btn btn-outline-info quick-action-btn" onclick="sendQuickMessage('Trang phục tập thể thao')">
                                    <i class="ri-run-line me-1"></i>Thể thao
                                </button>
                                <button class="btn btn-outline-danger quick-action-btn" onclick="sendQuickMessage('Đồ dự tiệc tối')">
                                    <i class="ri-goblet-line me-1"></i>Tiệc tối
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8 mx-auto">
                    <div class="chat-container shadow">
                        <div class="chat-header">
                            <div class="d-flex align-items-center justify-content-center">
                                <div class="me-3">
                                    <i class="ri-robot-fill display-6"></i>
                                </div>
                                <div>
                                    <h5 class="mb-1">LookAI Stylist</h5>
                                    <small class="opacity-75">Trợ lý thời trang AI của bạn</small>
                                </div>
                            </div>
                        </div>
                        
                        <div class="chat-messages" id="chatMessages">
                            </div>

                        <div class="chat-input">
                            <div class="input-group">
                                <input type="text" class="form-control" id="messageInput" placeholder="Nhập tin nhắn của bạn..." onkeypress="handleKeyPress(event)">
                                <button class="btn btn-primary" type="button" onclick="sendMessage()">
                                    <i class="ri-send-plane-line"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <div class="card border-0 shadow rounded">
                        <div class="card-body">
                            <h5 class="card-title mb-4">
                                <i class="ri-lightbulb-line text-primary me-2"></i>
                                Gợi Ý Phối Đồ Mới Nhất
                            </h5>
                            <div class="row" id="outfitSuggestions">
                                </div>
                        </div>
                    </div>
                </div>
            </div>

    <footer class="bg-footer">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="footer-py-60 text-center">
                        <p class="mb-0 text-muted">© 2024 LookAI. Thiết kế bởi <a href="#" target="_blank" class="text-reset">LookAI Team</a>.</p>
                    </div>
                </div>
            </div>
        </div>

    <a href="#" onclick="topFunction()" id="back-to-top" class="back-to-top fs-5"><i data-feather="arrow-up" class="fea icon-sm icons align-middle"></i></a>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/feather.min.js"></script>
    <script src="../assets/js/app.js"></script>
    
    <script>
        // === 1. THIẾT LẬP CẤU HÌNH ===
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        
        // Cấu hình URL backend của bạn
        const API_BASE_URL = 'https://ai-stylist-backend-r2j9.onrender.com'; // Thay đổi nếu server của bạn chạy ở port khác

        // Page navigation mapping (Giữ nguyên)
        const PAGE_LINKS = {
            'trang chủ': 'index.html',
            'home': 'index.html',
            'tủ đồ': 'wardrobe.html',
            'wardrobe': 'wardrobe.html',
            'quản lý tủ đồ': 'wardrobe.html',
            'thử đồ': 'virtual-fitting.html',
            'virtual fitting': 'virtual-fitting.html',
            'thử đồ ảo': 'virtual-fitting.html',
            'ar': 'virtual-fitting.html',
            'lookbook': 'departments.html',
            'bộ sưu tập': 'departments.html',
            'về chúng tôi': 'aboutus.html',
            'about': 'aboutus.html',
            'liên hệ': 'contact.html',
            'contact': 'contact.html'
        };

        // Biến cache (Giữ nguyên)
        let latestOutfitsCache = [];
        let favoritedHashesCache = new Set();
        
        // === 2. CÁC HÀM XỬ LÝ GIAO DIỆN CHAT (Không đổi) ===
        
        /**
         * Thêm tin nhắn vào cửa sổ chat
         */
        function addMessage(content, isUser = false, outfit = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            // Chuyển đổi markdown đơn giản (như \n, **, 🌤️) thành HTML
            let safeContent = content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            safeContent = safeContent.replace(/\n/g, '<br>');
            safeContent = safeContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            let messageHTML = `
                <div class="message-avatar">
                    <i class="${isUser ? 'ri-user-line' : 'ri-robot-line'}"></i>
                </div>
                <div class="message-content">
                    <p class="mb-0">${safeContent}</p>
            `;

            if (outfit) {
                messageHTML += `
                    <div class="outfit-suggestion mt-3">
                        <h6 class="mb-2">
                            <i class="${outfit.icon || 'ri-lightbulb-flash-line'} text-primary me-2"></i>
                            ${outfit.title}
                        </h6>
                        <div class="mb-2">
                            ${outfit.items.map(item => `<span class="outfit-item">${item}</span>`).join('')}
                        </div>
                        <small class="text-muted">
                            <i class="ri-thermometer-line me-1"></i>Phù hợp: ${outfit.weather}
                        </small>
                    </div>
                `;
            }

            messageHTML += '</div>';
            messageDiv.innerHTML = messageHTML;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        /**
         * Hiển thị chỉ báo "đang gõ"
         */
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot typing-indicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">
                    <i class="ri-robot-line"></i>
                </div>
                <div class="message-content">
                    <div class="typing-indicator" style="display: block;">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingDiv;
        }
        
        /**
         * Xử lý nhấn Enter
         */
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        /**
         * Gửi tin nhắn từ nút gợi ý nhanh
         */
        function sendQuickMessage(message) {
            messageInput.value = message;
            sendMessage();
        }

        // === 3. HÀM GỬI TIN NHẮN (Đã cập nhật) ===
        
        /**
         * Gửi tin nhắn đến Backend
         */
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            messageInput.value = '';
            const typingIndicator = showTypingIndicator();

            try {
                // 1. Kiểm tra điều hướng (Không đổi)
                const navigationResult = checkForNavigation(message);
                if (navigationResult) {
                    typingIndicator.remove();
                    addMessage(navigationResult.message, false);
                    setTimeout(() => {
                        window.location.href = navigationResult.url;
                    }, 2000);
                    return;
                }

                // 2. Gửi tin nhắn đến API Backend
                const response = await fetch(`${API_BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                typingIndicator.remove(); // Xóa typing
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Lỗi từ server');
                }

                // 3. Nhận phản hồi JSON từ Backend
                const aiJson = await response.json();
                
                // Backend trả về đúng định dạng { message, outfit }
                // nên ta chỉ cần hiển thị
                addMessage(aiJson.message, false, aiJson.outfit);

            } catch (error) {
                console.error('Lỗi khi gửi tin nhắn:', error);
                typingIndicator.remove();
                addMessage(`Ôi, có lỗi xảy ra rồi: ${error.message}. Vui lòng thử lại!`, false);
            }
        }

        // === 4. CÁC HÀM XỬ LÝ ĐIỀU HƯỚNG (Không đổi) ===
        
        /**
         * Kiểm tra yêu cầu điều hướng trong tin nhắn
         */
        function checkForNavigation(message) {
            const lowerMessage = message.toLowerCase();
            
            for (const [keyword, url] of Object.entries(PAGE_LINKS)) {
                if (lowerMessage.includes(keyword)) {
                    return {
                        message: `Đang chuyển bạn đến trang ${keyword}... 🚀`,
                        url: url
                    };
                }
            }
            return null;
        }

        // === 5. PHẦN GỢI Ý MỚI NHẤT (Đã cập nhật) ===
        // (Chỉ thêm API_BASE_URL, logic không đổi)
        
        /**
         * 1. Tải 3 gợi ý outfit mới nhất
         */
        async function loadLatestOutfits() {
            const suggestionsContainer = document.getElementById('outfitSuggestions');
            suggestionsContainer.innerHTML = '<p class="text-center text-muted col-12">Đang tải gợi ý mới nhất...</p>';

            try {
                // 1.1. Lấy 3 outfit mới nhất (Thêm API_BASE_URL)
                const response = await fetch(`${API_BASE_URL}/api/chat/latest-outfits`);
                const data = await response.json();

                if (!data.success || !data.outfits || data.outfits.length === 0) {
                    suggestionsContainer.innerHTML = '<p class="text-center text-muted col-12">Chưa có gợi ý nào được lưu.</p>';
                    return;
                }

                latestOutfitsCache = data.outfits; // Lưu vào cache
                
                // 1.2. Tạo hash và kiểm tra trạng thái yêu thích (Thêm API_BASE_URL)
                const hashes = latestOutfitsCache.map(outfit => outfit.title + outfit.items.join(','));
                
                const statusResponse = await fetch(`${API_BASE_URL}/api/lookbook/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hashes: hashes })
                });
                const statusData = await statusResponse.json();
                
                if (statusData.success) {
                    favoritedHashesCache = new Set(statusData.favoritedHashes);
                }

                // 1.3. Hiển thị ra HTML (Không đổi)
                suggestionsContainer.innerHTML = ''; // Xóa loading
                latestOutfitsCache.forEach((outfit, index) => {
                    const outfitHash = hashes[index];
                    const isFavorited = favoritedHashesCache.has(outfitHash);
                    
                    const icon = isFavorited ? 'ri-heart-fill' : 'ri-heart-line';
                    const btnClass = isFavorited ? 'btn-primary' : 'btn-outline-primary';

                    const outfitHtml = `
                        <div class="col-md-4 mb-4">
                            <div class="outfit-suggestion">
                                <h6 class="mb-3">
                                    <i class="${outfit.icon || 'ri-lightbulb-flash-line'} text-primary me-2"></i>
                                    ${outfit.title}
                                </h6>
                                <div class="mb-3">
                                    ${outfit.items.map(item => `<span class="outfit-item">${item}</span>`).join('')}
                                </div>
                                <small class="text-muted">
                                    <i class="ri-thermometer-line me-1"></i>Phù hợp: ${outfit.weather}
                                </small>
                                <div class="mt-2">
                                    <button class="btn btn-sm ${btnClass}" id="fav-btn-${index}" onclick="toggleFavorite(this, ${index})">
                                        <i class="${icon} me-1"></i>Yêu thích
                                    </button>
                                    <button class="btn btn-sm btn-outline-success">
                                        <i class="ri-share-line me-1"></i>Chia sẻ
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    suggestionsContainer.innerHTML += outfitHtml;
                });

            } catch (error) {
                console.error('Lỗi khi tải gợi ý mới nhất:', error);
                suggestionsContainer.innerHTML = '<p class="text-center text-danger col-12">Không thể tải gợi ý.</p>';
            }
        }

        /**
         * 2. Toggle Yêu thích (Thêm API_BASE_URL)
         */
        async function toggleFavorite(buttonElement, index) {
            const outfit = latestOutfitsCache[index];
            if (!outfit) return;

            buttonElement.disabled = true;
            buttonElement.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';

            try {
                // Thêm API_BASE_URL
                const response = await fetch(`${API_BASE_URL}/api/lookbook/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ outfit: outfit })
                });

                const data = await response.json();

                if (data.success) {
                    // Cập nhật giao diện nút (Không đổi)
                    if (data.favorited) {
                        buttonElement.classList.remove('btn-outline-primary');
                        buttonElement.classList.add('btn-primary');
                        buttonElement.innerHTML = '<i class="ri-heart-fill me-1"></i>Yêu thích';
                    } else {
                        buttonElement.classList.remove('btn-primary');
                        buttonElement.classList.add('btn-outline-primary');
                        buttonElement.innerHTML = '<i class="ri-heart-line me-1"></i>Yêu thích';
                    }
                }
            } catch (error) {
                console.error('Lỗi khi toggle yêu thích:', error);
                buttonElement.innerHTML = 'Lỗi';
            } finally {
                buttonElement.disabled = false;
            }
        }

        // === 6. KHỞI CHẠY TRANG (Đã cập nhật) ===
        
        /**
         * Chạy khi trang tải xong
         */
        document.addEventListener('DOMContentLoaded', async () => {
            feather.replace();
            
            try {
                // 1. Gọi API init để lấy tin nhắn chào mừng VÀ thời tiết
                const response = await fetch(`${API_BASE_URL}/api/chat/init`);
                if (!response.ok) {
                    throw new Error('Không thể kết nối với server');
                }
                
                const initData = await response.json();

                // 2. Hiển thị tin nhắn chào mừng từ server
                if (initData.welcomeMessage) {
                    addMessage(initData.welcomeMessage, false);
                }

                // 3. Hiển thị tin nhắn thời tiết từ server (nếu có)
                if (initData.weatherUpdate) {
                    // Thêm một chút delay cho tự nhiên
                    setTimeout(() => {
                        addMessage(initData.weatherUpdate, false);
                    }, 1500); // Delay 1.5 giây
                }
                
            } catch (error) {
                console.error('Lỗi khi khởi tạo chat:', error);
                addMessage('Chào bạn! Tôi là LookAI. (Không thể kết nối với máy chủ để lấy thông tin thời tiết).', false);
            }
            
            // 4. Tải các gợi ý mới nhất
            loadLatestOutfits();
        });
        
    </script>
